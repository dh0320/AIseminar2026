<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新規事業開発プレイブック 2026 ｜ プロセス・チェックリスト・プロンプト</title>
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#F2F5F9; --surface-3:#E9EEF5;
  --border:#E1E7F0; --border-2:#CFD8E5;
  --text:#131C2A; --text-2:#46566C; --muted:#74849A;
  --brand:#0E7A72; --brand-soft:#E2F2F0;
  --common:#4A5A70; --s1:#0B6E93; --s2:#0A7048; --s3:#9A5B06; --s4:#B01B45;
  --diff:#6B37CE; --diff-soft:#F1EBFD; --diff-line:#DCCCFA;
  --shadow:0 1px 2px rgba(19,28,42,.05), 0 1px 3px rgba(19,28,42,.04);
  --shadow-lg:0 12px 32px rgba(19,28,42,.12), 0 2px 8px rgba(19,28,42,.06);
  --code-bg:#111A26; --code-fg:#DDE7F2; --code-var:#F3C969;
  --r:12px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace;
  --jp:"Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0D131B; --surface:#151E29; --surface-2:#1B2632; --surface-3:#22303E;
  --border:#27333F; --border-2:#33424F;
  --text:#EAF0F7; --text-2:#B4C2D2; --muted:#8496A9;
  --brand:#4FD1C5; --brand-soft:#123833;
  --common:#9AAABE; --s1:#4FB6DC; --s2:#4CC38A; --s3:#E0A93C; --s4:#F0768F;
  --diff:#B79BF5; --diff-soft:#1F1A33; --diff-line:#3A2E5C;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 16px 40px rgba(0,0,0,.5);
  --code-bg:#0A1018; --code-fg:#D9E4F0;
}
html{font-size:var(--root-fs,16px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--jp);font-size:1rem;line-height:1.85;
  font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
a{color:var(--brand)}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}


.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.side{
  background:var(--surface);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;
}
.side::-webkit-scrollbar{width:8px}
.side::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
.brand{padding:22px 22px 18px;border-bottom:1px solid var(--border)}
.brand-mark{display:flex;align-items:center;gap:10px}
.brand-dot{width:26px;height:26px;border-radius:8px;background:var(--brand);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);font-size:0.75rem;font-weight:700}
html[data-theme="dark"] .brand-dot{color:#08201D}
.brand h1{margin:0;font-size:1.03125rem;font-weight:700;letter-spacing:.01em;line-height:1.4}
.brand .sub{margin-top:6px;font-size:0.78125rem;color:var(--muted);font-family:var(--mono);letter-spacing:.04em}

.nav-label{padding:18px 22px 8px;font-size:0.71875rem;font-family:var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.stages{padding:0 12px;display:flex;flex-direction:column;gap:2px}
.stage{
  display:flex;gap:13px;align-items:center;width:100%;text-align:left;
  padding:11px 12px;border-radius:10px;transition:background .13s;position:relative;
}
.stage:hover{background:var(--surface-2)}
.stage[aria-current="true"]{background:var(--surface-2)}
.stage[aria-current="true"]::before{content:"";position:absolute;left:-12px;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.ring{width:34px;height:34px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg);display:block}
.ring .bgc{stroke:var(--surface-3)}
.ring .fgc{stroke:var(--c);transition:stroke-dashoffset .35s}
.ring b{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:0.65625rem;color:var(--c);font-weight:700;letter-spacing:-.02em;
}
.stage-txt{min-width:0}
.stage-no{display:block;font-family:var(--mono);font-size:0.65625rem;letter-spacing:.12em;color:var(--muted)}
.stage-nm{display:block;font-size:0.9375rem;font-weight:700;line-height:1.45;margin-top:1px}
.stage-mt{display:block;font-size:0.78125rem;color:var(--muted);line-height:1.5;margin-top:1px}
.side-foot{margin-top:auto;padding:16px 22px 22px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:9px}
.side-actions,.preview-actions{display:flex;flex-direction:column;gap:9px}
.preview-actions{margin-top:4px;padding-top:13px;border-top:1px solid var(--border)}
.ghost{
  display:flex;align-items:center;gap:9px;font-size:0.875rem;color:var(--text-2);
  padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);transition:.13s;text-decoration:none;
}
.ghost:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-2)}
.ghost{white-space:nowrap}
.ghost svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9}
.preview-status{
  margin-left:auto;padding:2px 6px;border-radius:999px;background:var(--surface-3);
  color:var(--muted);font-family:var(--mono);font-size:0.65625rem;font-weight:700;letter-spacing:.04em;
}
.process-preview:disabled{
  color:var(--muted);background:var(--surface-2);border-color:var(--border);opacity:.62;cursor:not-allowed;
}
.process-preview:disabled:hover{color:var(--muted);background:var(--surface-2);border-color:var(--border)}


.top{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
}
.top-in{padding:12px 32px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:relative}
.search{position:relative;display:flex;align-items:center;flex:1 1 340px;max-width:460px}
.search input{
  width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:11px 38px 11px 40px;font-size:0.9375rem;transition:.13s;box-shadow:var(--shadow);
}
.search input:hover{border-color:var(--border-2)}
.search input::placeholder{color:var(--muted)}
.search .ico{position:absolute;left:13px;width:17px;height:17px;color:var(--muted);pointer-events:none;stroke:currentColor;fill:none;stroke-width:2}
.search .clear{position:absolute;right:8px;color:var(--muted);font-size:1.1875rem;line-height:1;padding:3px 7px;border-radius:7px}
.search .clear:hover{color:var(--text);background:var(--surface-2)}
.diffbtn{
  display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--surface);
  border-radius:10px;padding:9px 14px;font-size:0.90625rem;color:var(--text-2);box-shadow:var(--shadow);transition:.13s;
}
.diffbtn:hover{border-color:var(--border-2);color:var(--text)}
.track{width:34px;height:19px;border-radius:10px;background:var(--surface-3);position:relative;transition:background .18s;flex:none}
.knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .18s}
html[data-theme="dark"] .knob{background:#8496A9}
.diffbtn[aria-pressed="true"]{color:var(--diff);border-color:var(--diff-line);background:var(--diff-soft)}
.diffbtn[aria-pressed="true"] .track{background:var(--diff)}
.diffbtn[aria-pressed="true"] .knob{transform:translateX(15px);background:#fff}
.pill{font-family:var(--mono);font-size:0.75rem;padding:1px 9px;border-radius:999px;background:var(--surface-3);color:var(--muted)}
.diffbtn[aria-pressed="true"] .pill{background:#fff;color:var(--diff)}
html[data-theme="dark"] .diffbtn[aria-pressed="true"] .pill{background:var(--diff-line);color:var(--diff)}
.icobtn{
  width:42px;height:42px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:var(--text-2);box-shadow:var(--shadow);transition:.13s;
}
.icobtn:hover{border-color:var(--border-2);color:var(--text)}
.icobtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9}
.top-actions{display:contents}
.mobile-more-toggle{display:none}
.menu-label{display:none}


main{padding:34px 32px 96px;max-width:1500px}
.hero{margin-bottom:28px}
.crumb{font-family:var(--mono);font-size:0.75rem;letter-spacing:.13em;color:var(--c);font-weight:700}
.hero h2{margin:9px 0 0;font-size:2.0625rem;line-height:1.32;letter-spacing:-.01em;font-weight:700}
.lead{margin:14px 0 0;font-size:1.0625rem;line-height:1.85;color:var(--text-2);max-width:70ch}
.quickstart{margin-top:22px;padding:18px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--c);border-radius:0 var(--r) var(--r) 0;box-shadow:var(--shadow)}
.quickstart-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.quickstart-h span{font-family:var(--mono);font-size:0.6875rem;letter-spacing:.12em;color:var(--c);font-weight:700}
.quickstart-h b{font-size:1rem}
.quickstart-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quickstart-step{min-width:0;padding:12px 13px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px}
.quickstart-step .num{display:block;font-family:var(--mono);font-size:0.6875rem;letter-spacing:.08em;color:var(--c);font-weight:700;margin-bottom:5px}
.quickstart-step strong{display:block;font-size:0.9375rem;line-height:1.45;margin-bottom:4px}
.quickstart-step p{margin:0;color:var(--text-2);font-size:0.8125rem;line-height:1.65}
.quickstart-note{margin:12px 0 0;padding:11px 13px;border-radius:9px;background:color-mix(in srgb,var(--c) 8%,var(--surface));color:var(--text-2);font-size:0.875rem;line-height:1.75}
.quickstart-note strong{color:var(--text)}
.gate{
  margin-top:20px;display:flex;gap:14px;align-items:flex-start;max-width:860px;
  background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--c);
  border-radius:0 var(--r) var(--r) 0;padding:16px 20px;box-shadow:var(--shadow);
}
.gate .lbl{font-family:var(--mono);font-size:0.71875rem;letter-spacing:.1em;color:var(--c);white-space:nowrap;flex:none;padding-top:5px;font-weight:700}
.gate p{margin:0;font-size:1rem;font-weight:700;line-height:1.8}

.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:899px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (min-width:900px){.step-cols>.stack:last-child{position:sticky;top:88px}}
.stack{display:flex;flex-direction:column;gap:20px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--border)}
.card-h h3{margin:0;font-size:1.0625rem;font-weight:700;letter-spacing:.005em}
.card-h .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.card-b{padding:20px 22px;font-size:1rem;line-height:1.85;color:var(--text-2)}
.kv{margin:0 0 16px}
.kv:last-child{margin-bottom:0}
.kv dt{font-size:0.78125rem;font-family:var(--mono);letter-spacing:.1em;color:var(--muted);margin-bottom:4px}
.kv dd{margin:0;font-size:1rem;line-height:1.85;color:var(--text)}
.card-b ul.plain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.card-b ul.plain li{display:flex;gap:11px;font-size:1rem;line-height:1.8;color:var(--text-2)}
.card-b ul.plain li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none;margin-top:11px}
.chip-out{display:inline-flex;align-items:center;gap:7px;font-size:0.90625rem;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 12px}


.grp{border-top:1px solid var(--border)}
.grp:first-of-type{border-top:0}
.grp-h{width:100%;display:flex;align-items:center;gap:12px;padding:15px 22px;text-align:left;font-size:0.96875rem;font-weight:700;transition:background .12s}
.grp-h:hover{background:var(--surface-2)}
.grp-h .chev{width:12px;height:12px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex:none;margin-top:-5px}
.grp-h[aria-expanded="true"] .chev{transform:rotate(-135deg);margin-top:3px}
.grp-h .cnt{margin-left:auto;font-family:var(--mono);font-size:0.8125rem;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 10px;flex:none}
.count-badge{font-family:var(--mono);font-size:0.84375rem;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 12px}
.grp-h[aria-expanded="true"] .cnt{background:var(--surface-3)}
.grp-b{display:none;padding:0 22px 16px}
.grp-h[aria-expanded="true"]+.grp-b{display:block}
.chk{display:flex;gap:13px;align-items:flex-start;padding:9px 10px 9px 8px;border-radius:9px;transition:background .12s}
.chk:hover{background:var(--surface-2)}
.chk input{
  appearance:none;flex:none;width:20px;height:20px;margin-top:4px;border:2px solid var(--border-2);
  border-radius:6px;background:var(--surface);cursor:pointer;position:relative;transition:.14s;
}
.chk input:hover{border-color:var(--c)}
.chk input:checked{background:var(--c);border-color:var(--c)}
.chk input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.4px 2.4px 0;transform:rotate(42deg)}
html[data-theme="dark"] .chk input:checked::after{border-color:#0D131B}
.chk-t{font-size:0.96875rem;line-height:1.8;color:var(--text)}
.chk input:checked~.chk-w .chk-t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--border-2)}
.chk-w{min-width:0}
.chk label{cursor:pointer}


.tasks{display:flex;flex-direction:column;padding:6px}
.task{
  width:100%;text-align:left;display:block;padding:16px 18px;border-radius:10px;
  transition:background .13s,box-shadow .13s;position:relative;
}
.task:hover{background:var(--surface-2)}
.task+.task{border-top:1px solid var(--border);border-radius:10px}
.task-top{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.task-n{font-family:var(--mono);font-size:0.78125rem;font-weight:700;color:#fff;background:var(--c);border-radius:6px;padding:2px 8px;flex:none}
html[data-theme="dark"] .task-n{color:#0D131B}
.task-t{font-size:1.03125rem;font-weight:700;line-height:1.5}
.task-d{font-size:0.90625rem;line-height:1.75;color:var(--text-2);margin-top:7px;padding-right:26px}
.task-f{display:flex;align-items:center;gap:8px;margin-top:10px}
.task-count{font-size:0.8125rem;font-family:var(--mono);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:999px;padding:2px 10px}
.task-arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1rem;transition:transform .15s}
.task:hover .task-arrow{transform:translateY(-50%) translateX(3px);color:var(--c)}


.badge{font-family:var(--mono);font-size:0.65625rem;font-weight:700;letter-spacing:.08em;padding:2.5px 7px;border-radius:5px;line-height:1.4;white-space:nowrap;flex:none;display:inline-block}
.b-new{background:var(--diff);color:#fff}
.b-upd{background:#1E64C8;color:#fff}
.b-fix{background:#C2570C;color:#fff}
html[data-theme="dark"] .b-new{background:var(--diff-line);color:var(--diff)}
html[data-theme="dark"] .b-upd{background:#17334F;color:#7FB2E5}
html[data-theme="dark"] .b-fix{background:#3B2411;color:#E5915F}
body:not(.diff-on) .badge.dfb{display:none}
body:not(.diff-on) .diff-note{display:none}
.diff-note{
  margin:9px 0 3px;font-size:0.875rem;line-height:1.8;color:var(--text-2);
  border:1px solid var(--diff-line);background:var(--diff-soft);border-radius:9px;padding:11px 14px;
}
.diff-note b{color:var(--diff);font-weight:700;font-family:var(--mono);font-size:0.6875rem;letter-spacing:.08em;display:block;margin-bottom:3px}
.diff-note s{color:var(--muted)}
body.diff-on .chk[data-diff]{background:var(--diff-soft)}
body.diff-on .task[data-diff]{background:color-mix(in srgb,var(--diff-soft) 60%,transparent)}


.stepnav{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.navbtn{
  display:flex;flex-direction:column;gap:2px;flex:1 1 240px;text-align:left;padding:15px 20px;
  border:1px solid var(--border);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);transition:.13s;
}
.navbtn:hover{border-color:var(--border-2);transform:translateY(-1px)}
.navbtn span{font-size:0.78125rem;font-family:var(--mono);letter-spacing:.1em;color:var(--muted)}
.navbtn b{font-size:1rem;font-weight:700}
.navbtn.next{text-align:right;align-items:flex-end}


.mobile-dock{display:none}
.mobile-view-tabs{display:none}


.common-rule-h{width:100%;text-align:left;cursor:pointer}
.common-rule-h h3{min-width:0}
.common-chev{
  width:11px;height:11px;margin-left:2px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:rotate(45deg);transition:transform .18s;flex:none
}
.common-rule-h[aria-expanded="true"] .common-chev{transform:rotate(-135deg);margin-top:6px}
.common-key{padding:17px 22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.common-key-label{
  font-family:var(--mono);font-size:0.6875rem;font-weight:700;letter-spacing:.08em;color:var(--common);
  background:color-mix(in srgb,var(--common) 11%,transparent);border-radius:6px;padding:3px 8px;margin-top:3px
}
.common-key p{margin:0;font-size:1rem;line-height:1.8;color:var(--text);font-weight:650}
.common-detail{display:none;border-top:1px solid var(--border);background:color-mix(in srgb,var(--surface-2) 42%,transparent)}
.common-rule-h[aria-expanded="true"]~.common-detail{display:block}
.common-detail .diff-note{margin-top:0}


.scrim{position:fixed;inset:0;background:rgba(12,18,28,.42);opacity:0;pointer-events:none;transition:opacity .22s;z-index:50;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);z-index:60;background:var(--surface);
  transform:translateX(103%);transition:transform .28s cubic-bezier(.22,.72,.28,1);
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
}
.drawer.on{transform:none}
.drawer-h{padding:22px 26px;border-bottom:1px solid var(--border);display:flex;gap:14px;align-items:flex-start}
.drawer-h .crumb{font-size:0.71875rem}
.drawer-h h3{margin:8px 0 0;font-size:1.375rem;line-height:1.4;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.x{margin-left:auto;flex:none;width:38px;height:38px;border-radius:9px;color:var(--muted);font-size:1.375rem;line-height:1;display:flex;align-items:center;justify-content:center;transition:.13s}
.x:hover{background:var(--surface-2);color:var(--text)}
.drawer-b{overflow-y:auto;padding:0 26px 60px;flex:1}
.drawer-b::-webkit-scrollbar{width:10px}
.drawer-b::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:5px}
.drawer-lead{margin:22px 0;font-size:1rem;line-height:1.85;color:var(--text-2)}

.pblock{border:1px solid var(--border);border-radius:var(--r);margin-bottom:22px;background:var(--surface)}
.pblock-h{display:flex;gap:12px;align-items:center;padding:15px 18px;background:var(--surface-2);flex-wrap:wrap;border-bottom:1px solid var(--border);border-radius:calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0;position:sticky;top:0;z-index:3}
.pblock-h h4{margin:0;font-size:1rem;font-weight:700}
.copy{
  margin-left:auto;background:var(--c);color:#fff;border-radius:9px;padding:9px 17px;font-size:0.875rem;font-weight:700;
  display:flex;gap:8px;align-items:center;white-space:nowrap;transition:.13s;box-shadow:var(--shadow);
}
html[data-theme="dark"] .copy{color:#0D131B}
.copy:hover{filter:brightness(1.08)}
.copy.done{background:var(--brand)}
.copy svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}
.meta{padding:16px 18px 4px;display:flex;flex-direction:column;gap:11px}
.meta-row{display:flex;gap:14px;font-size:0.90625rem;line-height:1.75;color:var(--text)}
.meta-k{font-family:var(--mono);font-size:0.71875rem;letter-spacing:.06em;color:var(--muted);flex:none;width:86px;padding-top:4px}
pre{
  margin:16px 18px 18px;background:var(--code-bg);border-radius:10px;padding:18px;overflow-x:auto;
}
pre code{font-family:var(--mono);font-size:0.8125rem;line-height:1.8;white-space:pre-wrap;word-break:break-word;color:var(--code-fg)}
pre::-webkit-scrollbar{height:9px}
pre::-webkit-scrollbar-thumb{background:#3A4756;border-radius:5px}
.var{color:var(--code-var);font-weight:600}


.res-h{font-size:0.9375rem;color:var(--muted);margin:0 0 18px}
.res-list{display:flex;flex-direction:column;gap:10px;max-width:960px}
.res{
  width:100%;text-align:left;padding:17px 20px;border-radius:var(--r);background:var(--surface);
  border:1px solid var(--border);box-shadow:var(--shadow);transition:.13s;
}
.res:hover{border-color:var(--border-2);transform:translateY(-1px)}
.res .where{font-family:var(--mono);font-size:0.75rem;letter-spacing:.07em;color:var(--c);font-weight:700}
.res .t{display:block;font-size:1.03125rem;font-weight:700;margin-top:4px;line-height:1.6}
.res .s{display:block;font-size:0.90625rem;color:var(--text-2);margin-top:5px;line-height:1.7}
mark{background:color-mix(in srgb,var(--brand) 22%,transparent);color:inherit;border-radius:4px;padding:1px 3px;font-weight:700}
.empty{color:var(--muted);font-size:1rem}


.modal{position:fixed;z-index:70;inset:0;display:none;align-items:flex-start;justify-content:center;padding:5vh 20px 20px}
.modal.on{display:flex}
.modal-box{background:var(--surface);border-radius:16px;width:min(940px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal-h{padding:22px 26px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px}
.modal-h h3{margin:0;font-size:1.25rem;font-weight:700}
.modal-b{overflow-y:auto;padding:8px 26px 30px}
.modal-b::-webkit-scrollbar{width:10px}
.modal-b::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:5px}
.cl-sec{margin-top:26px}
.cl-sec>h4{margin:0 0 12px;font-family:var(--mono);font-size:0.75rem;letter-spacing:.13em;color:var(--diff);font-weight:700}
.cl{border-left:3px solid var(--border);padding:2px 0 2px 18px;margin:0 0 18px}
.cl .t{font-size:1rem;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap;line-height:1.6}
.cl .d{font-size:0.9375rem;color:var(--text-2);margin-top:5px;line-height:1.8}
.cl .why{font-size:0.90625rem;color:var(--muted);margin-top:5px;line-height:1.8}
.cl .why::before{content:"なぜ";font-family:var(--mono);font-size:0.6875rem;letter-spacing:.1em;color:var(--diff);border:1px solid var(--diff-line);border-radius:5px;padding:1px 6px;margin-right:8px}
.srcs{display:flex;flex-direction:column;gap:9px;font-size:0.9375rem}


.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);z-index:80;
  background:var(--text);color:var(--bg);font-size:0.9375rem;font-weight:700;padding:13px 26px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--shadow-lg);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.kbd{font-family:var(--mono);font-size:0.75rem;border:1px solid var(--border-2);border-radius:5px;padding:2px 7px;color:var(--text-2);background:var(--surface)}
.foot{margin-top:44px;padding-top:22px;border-top:1px solid var(--border);color:var(--muted);font-size:0.875rem;line-height:1.9}


@media (max-width:1180px){
  .desktop-only{display:none!important}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border)}
  .brand{padding:16px 20px 14px;border-bottom:0}
  .nav-label{display:none}
  .stages{flex-direction:row;overflow-x:auto;padding:0 14px 14px;gap:8px;scrollbar-width:thin}
  .stages::-webkit-scrollbar{height:5px}
  .stages::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px}
  .stage{flex:none;min-width:210px;border:1px solid var(--border);background:var(--surface)}
  .stage[aria-current="true"]{border-color:var(--c);background:var(--surface-2)}
  .stage[aria-current="true"]::before{display:none}
  .side-foot{flex-direction:column;padding:0 18px 12px;border-top:0;margin-top:0;gap:8px}
  .side-actions{flex-direction:row;gap:8px}
  .preview-actions{margin-top:0;padding-top:8px}
  .preview-actions .ghost{width:100%}
  .ghost{flex:1;justify-content:center;padding:9px 10px;font-size:0.84375rem}
  .preview-status{display:none}
  .brand{padding:15px 18px 12px}
  .brand h1{font-size:0.96875rem}
  .stage{min-width:196px}
  .top-in{padding:11px 18px;flex-wrap:nowrap}
  .search{flex:1 1 auto;min-width:0;max-width:none}
  .project-top{padding:9px 10px;flex:none}
  .project-top .pj-label{display:none}
  .top-actions{
    display:none;position:absolute;right:18px;top:calc(100% + 6px);z-index:40;width:min(280px,calc(100vw - 36px));
    padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg)
  }
  .top-actions.on{display:flex;flex-direction:column;gap:6px}
  .top-actions .diffbtn,.top-actions .icobtn{
    width:100%;min-height:44px;height:auto;justify-content:flex-start;box-shadow:none;padding:9px 12px
  }
  .top-actions .icobtn{gap:11px}
  .top-actions .menu-label{display:inline;font-size:0.90625rem;font-weight:700}
  .mobile-more-toggle{display:flex;flex:none}
  main{padding:24px 18px 70px}
  .hero h2{font-size:1.625rem}
  .lead{font-size:1rem}
}
@media (max-width:899px){
  .quickstart-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mobile-view-tabs{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;position:sticky;top:64px;z-index:25;
    margin:-6px 0 18px;padding:5px;background:color-mix(in srgb,var(--surface) 94%,transparent);
    border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);backdrop-filter:blur(12px)
  }
  .mobile-view-tabs button{
    min-width:0;padding:10px 7px;border-radius:9px;color:var(--muted);font-size:0.84375rem;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:6px
  }
  .mobile-view-tabs button[aria-selected="true"]{background:var(--brand);color:#fff;box-shadow:var(--shadow)}
  html[data-theme="dark"] .mobile-view-tabs button[aria-selected="true"]{color:#0D131B}
  .mobile-view-tabs .tab-count{font-family:var(--mono);font-size:0.6875rem;opacity:.82}
  .step-cols[data-mobile-active="tasks"] .step-left{display:none}
  .step-cols[data-mobile-active="overview"] .step-right,
  .step-cols[data-mobile-active="checks"] .step-right{display:none}
  .step-cols[data-mobile-active="overview"] .pane-checks{display:none}
  .step-cols[data-mobile-active="checks"] .pane-overview{display:none}
}
@media (max-width:560px){
  body{font-size:0.96875rem;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  .top-in{gap:8px}
  .tbtn,.diffbtn{padding:8px 11px;font-size:0.84375rem;gap:7px}
  .tbtn svg{width:15px;height:15px}
  .track{width:30px;height:17px}
  .knob{width:13px;height:13px}
  .diffbtn[aria-pressed="true"] .knob{transform:translateX(13px)}
  .icobtn{width:38px;height:38px}
  .brand{padding:13px 18px 10px}
  .stage{min-width:180px;padding:9px 10px}
  .hero h2{font-size:1.4375rem}
  .quickstart{padding:15px}
  .quickstart-steps{grid-template-columns:minmax(0,1fr)}
  .card-h,.grp-h{padding-left:16px;padding-right:16px}
  .card-b,.grp-b,.common-key{padding-left:16px;padding-right:16px}
  .tasks{padding:4px}
  .drawer-h,.drawer-b{padding-left:18px;padding-right:18px}
  .search{min-width:0}
  pre{margin-left:12px;margin-right:12px;padding:14px}
  .mobile-dock{
    position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:45;
    display:grid;grid-template-columns:minmax(0,1fr) minmax(132px,1.45fr) minmax(0,1fr);gap:6px;
    padding:6px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--border);
    border-radius:16px;box-shadow:var(--shadow-lg);backdrop-filter:blur(14px)
  }
  .mobile-dock button{
    min-width:0;min-height:50px;border-radius:11px;padding:7px 8px;display:flex;align-items:center;justify-content:center;
    gap:5px;color:var(--text-2);font-size:0.8125rem;font-weight:700;line-height:1.25;white-space:nowrap
  }
  .mobile-dock button:not(:disabled):hover{background:var(--surface-2);color:var(--text)}
  .mobile-dock button:disabled{opacity:.34;cursor:default}
  .mobile-dock .mobile-prompt{background:var(--brand);color:#fff;box-shadow:var(--shadow)}
  html[data-theme="dark"] .mobile-dock .mobile-prompt{color:#0D131B}
  .mobile-dock .mobile-prompt:not(:disabled):hover{background:var(--brand);color:#fff;filter:brightness(1.08)}
  html[data-theme="dark"] .mobile-dock .mobile-prompt:not(:disabled):hover{color:#0D131B}
  body.drawer-open .mobile-dock{display:none}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


.tbtn{display:flex;align-items:center;gap:9px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 14px;font-size:0.90625rem;color:var(--text-2);box-shadow:var(--shadow);transition:.13s;white-space:nowrap}
.tbtn:hover{border-color:var(--border-2);color:var(--text)}
.tbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;flex:none}
.tbtn.filled{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 40%,transparent);background:var(--brand-soft)}
.tbtn.filled .pill{background:var(--brand);color:#fff}
html[data-theme="dark"] .tbtn.filled .pill{color:#0D131B}
.icobtn.txt{font-weight:800;font-size:0.875rem;letter-spacing:-.02em}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:0.84375rem;font-weight:700;color:var(--text-2)}
.field input,.field textarea{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:11px 13px;font-size:0.9375rem;line-height:1.7;font-family:inherit;transition:border-color .13s}
.field textarea{min-height:78px;resize:vertical}
.field input:hover,.field textarea:hover{border-color:var(--border-2)}
.field input:focus,.field textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 16%,transparent)}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:.8}
.hint{font-size:0.84375rem;color:var(--muted);line-height:1.75;margin:0}
.linkbtn{color:var(--brand);font-weight:700;font-size:0.84375rem;text-decoration:underline;text-underline-offset:3px;padding:0}
.linkbtn:hover{opacity:.75}

.pform{padding:16px 18px;background:var(--surface-2);border-top:1px solid var(--border)}
.pform-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pform-h b{font-size:0.90625rem}
.pform-h .used{margin-left:auto;font-size:0.8125rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot-ok{width:7px;height:7px;border-radius:50%;background:var(--brand);flex:none}
.dot-no{width:7px;height:7px;border-radius:50%;background:var(--border-2);flex:none}
.pform .hint{margin-top:11px}
.val{color:#7FE6CE;background:rgba(127,230,206,.12);border-radius:4px;padding:0 3px;font-weight:600}
.ctx-note{color:#8FA6B8}

.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:16px 26px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 16px 16px;flex-wrap:wrap}
.btn-primary{background:var(--brand);color:#fff;border-radius:10px;padding:11px 22px;font-size:0.9375rem;font-weight:700;box-shadow:var(--shadow)}
html[data-theme="dark"] .btn-primary{color:#0D131B}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:11px 18px;font-size:0.9375rem;font-weight:700;color:var(--text-2)}
.btn-ghost:hover{border-color:var(--border-2);color:var(--text)}
@media (max-width:700px){.form-grid{grid-template-columns:minmax(0,1fr)}.field.full{grid-column:auto}}

.diffbtn.route[aria-pressed="true"]{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 40%,transparent);background:var(--brand-soft)}
.diffbtn.route[aria-pressed="true"] .track{background:var(--brand)}
.routeline{margin:16px 0 0;font-size:0.90625rem;color:var(--text-2);background:var(--brand-soft);border-radius:10px;padding:12px 16px;display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:860px}
.routeline b{color:var(--brand);font-weight:700}
.more-row{padding:14px 22px 18px;border-top:1px solid var(--border)}
.tasks+.more-row{border-top:0;padding-top:4px}

.tasklink{font-family:var(--mono);font-size:0.75rem;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent);border:1px solid color-mix(in srgb,var(--c) 26%,transparent);border-radius:6px;padding:1px 7px;margin-left:8px;vertical-align:1px;white-space:nowrap;transition:.12s}
.tasklink:hover{background:var(--c);color:#fff;border-color:var(--c)}
html[data-theme="dark"] .tasklink:hover{color:#0D131B}
.chk-hint{margin:0;padding:12px 22px 0;font-size:0.84375rem;color:var(--muted);line-height:1.7}
@media print{.tasklink{border:0;background:none;color:#555}}
.lv{display:inline-flex;align-items:center;font-size:0.75rem;font-weight:700;border-radius:6px;padding:3px 9px;white-space:nowrap;flex:none}
.lv-must{background:var(--brand);color:#fff}
html[data-theme="dark"] .lv-must{color:#0D131B}
.lv-opt{background:var(--brand-soft);color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 35%,transparent)}
.lv-ext{background:var(--surface-3);color:var(--muted)}
.lv-ext.dim{opacity:.75}
.task-f{gap:7px;flex-wrap:wrap}
.optnote{background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 30%,transparent);color:var(--text);border-radius:10px;padding:12px 16px;margin:0 0 18px;font-size:0.90625rem;line-height:1.75}
.optnote b{color:var(--brand)}
.needline{margin:0 0 12px;font-size:0.84375rem;line-height:1.75;color:var(--muted)}
.needline .miss{color:var(--text-2);background:var(--surface-3);border-radius:4px;padding:0 4px;margin-left:3px;font-size:0.6875rem}
.pblock-h h4{flex:1 1 auto}
.chip-out.ext{opacity:.6;border-style:dashed}
.fgrp{margin:6px 0 12px;font-size:0.90625rem;font-weight:700;color:var(--brand)}
.fgrp+.form-grid{margin-bottom:22px}

.tasklink{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:0.75rem;font-weight:700;
  color:var(--brand);background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 28%,transparent);
  border-radius:6px;padding:2px 8px;margin-left:6px;vertical-align:1px;transition:.13s;white-space:nowrap;max-width:100%}
.tasklink:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
html[data-theme="dark"] .tasklink:hover{color:#0D131B}
.tasklink span{font-family:var(--jp);font-weight:600;font-size:0.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:14em}
@media (max-width:700px){.tasklink span{display:none}}
@media print{.tasklink{background:none;border-color:#bbb;color:#333}}


@media print{
  .pblock-h{position:static}
  :root{--bg:#fff;--surface:#fff;--surface-2:#fff;--surface-3:#f2f2f2;--text:#000;--text-2:#222;--muted:#555;--border:#bbb;--shadow:none;--shadow-lg:none}
  html[data-theme="dark"]{--bg:#fff;--surface:#fff;--text:#000;--text-2:#222;--muted:#555;--border:#bbb}
  body{font-size:10.5pt}
  .top,.side,.stepnav,.mobile-dock,.foot,.scrim,.toast,.modal,.task-arrow{display:none!important}
  .app{display:block}
  main{padding:0;max-width:none}
  .cols{grid-template-columns:1fr!important;gap:14px}
  .cols>.stack:last-child{position:static!important}
  .card,.res,.gate{box-shadow:none!important;break-inside:avoid}
  .grp-b{display:block!important}
  .grp-h .chev{display:none}
  .hero h2{font-size:20pt}
  .drawer{display:none}
  body.drawer-open .app{display:none}
  body.drawer-open .drawer{display:flex;position:static;width:auto;transform:none;box-shadow:none;border:0}
  body.drawer-open .drawer-b{overflow:visible;max-height:none;padding:0}
  body.drawer-open .pform{display:none}
  body.drawer-open .copy{display:none}
  pre{background:#f4f6f8!important;border:1px solid #ccc}
  pre code{color:#111!important}
  .var{color:#8a6d00!important}
  .val{color:#0b6b5f!important;background:none!important}
}

</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">
        <span class="brand-dot">BD</span>
        <h1>新規事業開発<br>プレイブック</h1>
      </div>
      <div class="sub">v4.8 ／ 2026-08 更新</div>
    </div>
    <div class="nav-label">工程</div>
    <nav class="stages" id="rail" aria-label="工程"></nav>
    <div class="side-foot">
      <div class="side-actions">
        <button class="ghost" id="openLog">
          <svg viewBox="0 0 24 24"><path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/></svg>
          更新履歴を見る
        </button>
        <button class="ghost" id="reset">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          チェックをリセット
        </button>
      </div>
      <div class="preview-actions">
        <button class="ghost process-preview" id="processPreview" type="button" disabled aria-disabled="true" aria-label="検討プロセスは講義後に公開します">
          <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <span>検討の例を見る</span>
          <span class="preview-status">講義後公開</span>
        </button>
      </div>
    </div>
  </aside>

  <div>
    <header class="top">
      <div class="top-in">
        <div class="search">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
          <input id="q" type="search" placeholder="タスク・プロンプト・チェック項目を検索" aria-label="検索">
          <button class="clear" id="qclear" hidden aria-label="検索をクリア">&times;</button>
        </div>
        <button class="tbtn project-top" id="pjOpen" title="プロジェクト情報を入力する">
          <svg viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H17l3 3v10.5a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><path d="M8 10h8M8 14h5"/></svg>
          <span class="pj-label">プロジェクト情報</span>
          <span class="pill" id="pjCount">0/9</span>
        </button>
        <div class="top-actions" id="topActions" aria-label="表示設定">
          <button class="diffbtn route" id="routeToggle" aria-pressed="true" title="必須・選択のプロンプトだけに絞って表示する">
            <span class="track"><span class="knob"></span></span>
            <span>基本ルート</span>
          </button>
          <button class="diffbtn" id="diffToggle" aria-pressed="false" title="2025年版からの変更点を表示">
            <span class="track"><span class="knob"></span></span>
            <span>差分表示</span>
            <span class="pill" id="diffCount">0</span>

    { type:'fix', t:'基本ルートだけではゲートと成果物を満たせなかった', d:'旧「最短ルート」はタスク単位で表示を絞っていたため、STEP1のアセット棚卸し表、STEP2のペルソナシート、STEP3のユニットエコノミクス試算表（＝単位あたり粗利のゲート）、STEP4の想定問答集など、6つの成果物とゲートがルート内で作れない状態だった。該当タスクをルートに戻し、代わりに成果物側も「基本／発展」に分けた（AI検索での推薦状況レポートと事前検死レポートは発展）。', why:'必須タスクを選ぶときに、各ステップの判断ゲートと成果物を突き合わせていなかった。ゲートは表示設定で変わってよいものではないので、ルート側を直すのが筋だった。' },
    { type:'upd', t:'絞り込みをタスク単位からプロンプト単位に変え、「基本ルート」に改称', d:'29本のプロンプトを、必須16本／選択6本（同じタスクの中から1本選ぶ）／発展7本に区分し、各プロンプトにラベルを表示した。タスクが表示されるかは、その中に必須・選択のプロンプトがあるかで決まる。', why:'旧版はタスクが10本に見えても、その中に17本のプロンプトがあり、全部やるのか選ぶのかが分からなかった。判断の単位はタスクではなくプロンプトだった。' },
    { type:'new', t:'共通入力に「今回の目的・決めたいこと」「読み手・判断者」「良いアウトプットの条件」を追加', d:'共通情報を9項目に増やし、ダイアログを「①この検討について」「②事業の中身」の2群に分けた。', why:'共通ルール①が挙げる5点セットのうち、最も効く「目的と判断者」「評価基準」が入力欄に無かった。事業の説明だけを渡しても、AIは何のための出力かを判断できない。' },
    { type:'fix', t:'共通情報を、プロンプトごとに必要なものだけ渡すようにした', d:'これまでは入力済みの共通情報をすべてのプロンプトに一律で付けていた。プロンプトごとに渡す項目を定義し、画面にも「このプロンプトに渡す共通情報」として表示するようにした。', why:'共通ルール①の「関係のない情報はノイズになる」と実装が矛盾していた。実害もある。たとえば顧客インタビューの設計プロンプトに自社の強みを渡すと、質問が誘導的になる。' }
  ]},
  { sec: 'v4.0（2026-08-19）の変更', items: [
    { type:'fix', t:'「AIを組み込む事業」向けの項目を削除した', d:'STEP3の判断ゲートから「AI原価」を外し、「課金単位が決まり、単位あたり粗利がプラスで説明できる」に戻した。あわせて、推論コストの原価計上、人間の最終判断（HITL）と責任分界、AI利用の透明性表示、学習データの権利、モデルの値上げ・提供終了、ベンダー依存、精度劣化時の運用など、AIを製品に組み込む場合にしか意味を持たない14項目を削除した。', why:'このプレイブックの目的は「AIを使って事業開発の作業を高度化すること」であって、「AIを組み込んだ事業をつくること」ではない。玩具・物流・ヘルスケアのようにAIを製品に載せない事業でも、ゲートが通れる状態に戻す必要があった。' },
    { type:'upd', t:'削除ではなく一般化したもの', d:'3-5は「AI原価とユニットエコノミクスの試算」→「ユニットエコノミクスの試算」に改称し、原価の積み上げを人手・外部委託・材料費でも使える形にした。「モデルの値上げ・提供終了」は「主要な仕入先・外部サービスの値上げや提供終了」へ、「AI代替耐性」は「模倣困難性」へ、「汎用AIでできますよね」は「今のやり方や既存ツールでできますよね」へ書き換えた。', why:'単位経済性や模倣困難性そのものは、どの業種でも必要な論点だから。AIという言葉に紐づいていたために業種が限定されていただけで、中身は捨てるべきものではなかった。' },
    { type:'upd', t:'共通ルール④を「AIに何を入れてよいかを先に決める」に変更', d:'EU AI Actの透明性義務など製品側の規制を外し、営業秘密、インタビュー記録の個人情報、借用資料の入力可否、社内ポリシー、社外に出す前の人による確認、の5点に絞った。', why:'調査や資料づくりでAIを使う人が実際に踏む地雷はこちらで、製品にAIを載せるときの規制とは別物だから。' },
    { type:'new', t:'最短ルート表示を追加', d:'タスクとチェック項目に必須の印を付け、画面上部のトグルで必須だけに絞れるようにした。19タスク→10本、チェック項目も半分以下になる。初回はこの表示で開く。', why:'項目数が増えて、初めて使う人がどこから手を付ければよいか分からなくなっていた。案内を別に書き起こすと本文と二重管理になるため、本文に印を付けるだけの方式にした。' }
  ]},
  { sec: '全体の考え方', items: [
    { type:'new', t:'「共通ルール」を新設', d:'4ステップの手前に、全工程に共通する前提（コンテキスト設計、エージェント活用、出力の検品、ガバナンス、AIで作れるものは差別化にならない）を置いた。', why:'2025年版はプロンプト単体の集合だった。モデルが賢くなり、差がつく場所が「文面の巧拙」から「何を渡すか・出てきたものをどう検品するか」に移ったため。' },
    { type:'upd', t:'推奨ツールの表記を「役割」ベースに変更', d:'「ChatGPT, Gemini等のチャット型ツール／Deep Research等」の2分類から、㋐深掘り調査 ㋑長時間の実務遂行（エージェント型） ㋒日常の壁打ち ㋓難所の推論、の4役割に変更。モデル名は参考として併記するに留めた。', why:'モデル名と序列が数か月単位で変わる。名前で書くと、この資料自体がすぐ古くなる。' },
    { type:'new', t:'各プロンプトに「添付すべきコンテキスト」欄を追加', d:'プロンプト本文と並べて、何を一緒に渡すべきかを明示した。', why:'同じプロンプトでも、自社の一次情報を添えたかどうかで出力の質が最も大きく変わるため。' },
    { type:'new', t:'出力の検品ルールを全ステップに適用', d:'出典・取得日・算出式の明示、「未確認」と書かせる指示、事実／推計／解釈の分離を、主要プロンプトに組み込んだ。', why:'調べる速度が上がったぶん、誤りが検証されないまま社内資料に流れ込む事故が増えたため。' }
  ]},
  { sec: 'STEP 1 アイデア創出', items: [
    { type:'new', t:'チェックリストに「AI耐性」「データ資産」の観点を追加', d:'マクロ環境にAIによる前提崩壊と規制の時計を、自社の強みにデータ資産・許認可・現場アクセスを追加。', why:'アイデアを出すコストがゼロに近づき、差別化の源泉が「独自の入力」に移ったため。' },
    { type:'upd', t:'1-1 情報収集プロンプトを全面書き直し', d:'旧版は調査の切り口の例文が壊れていた（判読不能な文字列が混入）。出力ルール（出典・未確認の明示・不確かな前提トップ3）を追加。', why:'記述ミスの修正と、Deep Research前提への対応。' },
    { type:'upd', t:'PEST分析 → PESTLE分析に拡張', d:'Legal（法規制）とEnvironment（環境）を独立させ、法規制ではAI・データ規制を必須項目にした。', why:'AI規制が事業設計の前提条件になり、政治の一部として扱えなくなったため。' },
    { type:'upd', t:'1-3 を「自社資源・データ資産の棚卸し」に改称・拡張', d:'6カテゴリー→8カテゴリー（データ資産、許認可・規制ライセンス、現場アクセスを追加）。評価軸に「AI代替耐性」を追加。', why:'「競合に無い」だけでは強みと呼べなくなり、「汎用AIで再現できないか」まで問う必要が出たため。' },
    { type:'new', t:'1-4 に「陳腐化テスト」プロンプトを追加', d:'汎用AI再現テスト／模倣テスト／モデル進化テスト／支払い意思テストの4関門でアイデアを潰す。', why:'発想の価値が「出す」から「潰す」に移ったため。' },
    { type:'upd', t:'1-5 の評価観点を5→8に変更', d:'AI耐性・データ優位性・撤退容易性を追加。各20点→各15点に配分変更。', why:'同上。加えて、撤退設計を最初から評価に入れるため。' }
  ]},
  { sec: 'STEP 2 市場調査と顧客理解', items: [
    { type:'upd', t:'市場規模推計に「二重推計の突合」を必須化', d:'トップダウンとボトムアップの両方を出させ、2倍以上乖離する場合は原因を説明できるまで使用不可とした。', why:'AIは市場規模をもっともらしく1本の数字で出す。最も安価で効果の高いハルシネーション対策。' },
    { type:'upd', t:'競合分析の「代替品」に汎用AIでの内製運用を必須追加', d:'代替品の定義に「汎用AI＋既存ツールでの自力運用」「Excel等の手作業」を必ず含めるよう変更。', why:'2026年時点で、多くのBtoB商材の最大の競合がここになっているため。' },
    { type:'new', t:'2-5「AI検索での推薦状況の調査」を新設', d:'複数の生成AIに購買者クエリを投げ、推薦企業・引用元・自社の扱い・事実誤認を記録する調査手順を追加。', why:'BtoBの検討が生成AIへの相談から始まる比率が上がり、検索順位を取っていてもAIの回答に名前が出なければ候補に入らないため。' },
    { type:'new', t:'2-4 に「インタビュー記録の分析」プロンプトを追加', d:'反証となる発言を先に探させ、言葉と行動の矛盾、顧客の語彙、セグメントの兆候を抽出する。', why:'文字起こしが実質無料になり、ボトルネックが「録ること」から「都合よく読まずに読み解くこと」に移ったため。' },
    { type:'new', t:'AIペルソナ・仮想インタビューの扱いを明記', d:'仮説生成までが用途であり、実インタビューの代替にはならないという但し書きを追加。', why:'仮想ペルソナの出力が自然になった結果、実顧客に会わずに進む事故が起きやすくなったため。' }
  ]},
  { sec: 'STEP 3 コンセプトとビジネスモデル', items: [
    { type:'upd', t:'収益モデルのチェック項目を再構成', d:'「誰がいくら払うか」から「課金単位（バリューメトリクス）は何か」に変更。基本料＋従量のハイブリッド、成果報酬の落とし穴、モデル価格改定への備えを追加。', why:'AIが人の作業を代替すると、シート数が減っても価値は増える。人数×月額を前提に置けなくなったため。' },
    { type:'new', t:'3-5「ユニットエコノミクスの試算」を新設', d:'工程別の原価積み上げ、感度分析、コスト削減の打ち手、価格設計と契約条項への示唆までを1本のプロンプトに。', why:'価格だけ先に決まり、提供1件あたりの原価が積み上がっていない企画が多い。「使われるほど赤字」は稼働後に気づくと手遅れになるため。' },
    { type:'upd', t:'ビジネスモデルキャンバスに2ブロック追加', d:'9ブロックに加えて「課金単位」「変動費と限界費用」を追加。', why:'この2つが2026年の事業設計で最も抜けやすく、かつ後から入れると高くつくため。' },
    { type:'upd', t:'MVP定義書に「型の選定」と「品質設計」を追加', d:'5つのMVP型から選ばせる工程と、評価用データセット・ガードレール・撤退基準の定義を追加。', why:'数日で動くものが作れるようになり、制約が「作れるか」から「何を検証するか」に移ったため。安易にプロトタイプ型を選ばせない歯止めでもある。' },
    { type:'upd', t:'LP作成プロンプトを検証志向に変更', d:'「HTMLで出力」から、公開して反応を測れる状態＋AIに正しく要約される構造（見出し階層・FAQ・具体数値・提供者明示）へ。', why:'LPが人間だけでなくAIにも読まれ、そこでの説明が購買検討の入口になったため。' }
  ]},
  { sec: 'STEP 4 事業計画とプレゼン', items: [
    { type:'fix', t:'【不具合修正】4-2 のプロンプトが 4-1 と同一だった', d:'2025年版では「ピッチ資料の作成」のプロンプト本文が「事業計画案の作成」とまったく同じ内容だった（コピー漏れと思われる）。スライド構成表・スピーカーノート・削る判断・最後の1枚までを含む専用プロンプトに差し替えた。', why:'実際に使うと事業計画書がもう一度出てくるだけで、資料が作れなかったため。' },
    { type:'new', t:'数字への「根拠レベル」ラベルを必須化', d:'〔実測〕〔一次〕〔推計〕〔仮説〕の4段階を、計画書・プレゼン資料の両方で維持するよう指示に追加。', why:'AIで作った資料は体裁が整うぶん、根拠の厚みが見えない。決裁者が知りたいのは「どこまで確かめたか」だから。' },
    { type:'new', t:'チェックリストに「AI活用の説明責任」の群を新設', d:'どこにAIを使い、どこを人が検証したか／入力した情報の範囲／出典が原典まで辿れるか、の3項目。', why:'AIで作った資料は体裁が整うぶん、根拠の厚みが見えない。決裁者が問うのは「どこまで確かめたか」だから。' },
    { type:'new', t:'4-4「事前検死（プレモーテム）」を新設', d:'18か月後に失敗した前提で死因・沈黙の失敗・暗黙の前提・早期警戒指標を洗い出す。', why:'モデルの批判能力が上がり、反証を任せる価値が高くなった。想定問答が受けの準備なのに対し、これは先に潰すための工程。' },
    { type:'new', t:'撤退基準（Kill criteria）を計画の必須項目に', d:'「いつまでに、どの指標が、どの水準を下回ったら撤退・縮小するか」を決裁前に明記させる。', why:'始める条件だけ議論して、やめる条件を決めない計画は後から止められなくなるため。' }
  ]},
  { sec: '使い勝手・実装', items: [
    { type:'upd', t:'横スクロールの4カード → ステップ切替＋2カラム', d:'工程レール（共通ルール＋4ステップ）で切り替え、左に判断材料、右にタスクを置いた。プロンプトは中央のモーダルではなく右のドロワーで開くため、ステップの文脈を見ながらコピーできる。', why:'旧版は4枚のカードを横スクロールする構造で、目的のタスクに辿り着くまでの操作が多かったため。' },
    { type:'new', t:'差分表示（見え消し）モードを追加', d:'画面右上のトグルで、新規追加・変更・修正の箇所すべてにバッジと注記が表示される。旧版の記述と、変更した理由が併記される。', why:'この資料自体が毎年更新される前提のため。どこが変わったかを資料の中で完結させた。' },
    { type:'new', t:'全文検索を追加', d:'タスク名・説明・プロンプト本文・チェックリストを横断検索。ヒット箇所をハイライト表示。', why:'プロンプトが29本に増え、どのステップに何があるか記憶に頼れなくなったため。' },
    { type:'new', t:'チェックリストの進捗表示', d:'チェック数を工程レールとステップ見出しに表示。ページを開いている間だけ保持。', why:'チェックリストが実際に使われているかを可視化するため。' },
    { type:'upd', t:'外部CDN依存を排除し、単一ファイルで完結', d:'Tailwind CDNとGoogle Fontsの読み込みをやめ、CSSを内包。オフラインでも開き、社内共有時に外部通信が発生しない。', why:'社外秘の検討に使う資料が、開くたびに外部へ通信するのは望ましくない。読み込みも速くなる。' },
    { type:'upd', t:'コピー処理を刷新', d:'非推奨のdocument.execCommandから、Clipboard APIへ変更（未対応環境向けのフォールバックあり）。', why:'ブラウザによっては旧APIが動かなくなるため。' },
    { type:'upd', t:'アクセシビリティと操作性の改善', d:'キーボード操作（/ で検索、Escで閉じる）、フォーカス表示、aria属性、モーション低減設定への対応、スマートフォン表示の改善。', why:'会議中にスマートフォンで開く場面を想定。' },
    { type:'new', t:'プロンプトに入力フォームを追加（v3.1）', d:'「プロジェクト情報」に6項目（製品名・事業テーマ・対象顧客・自社の強み・制約条件・対象地域）を一度入力すると、29本すべてのプロンプトへ自動で反映される。各プロンプトには固有の入力欄を0〜3個だけ用意した。入力値はプレビューに色付きで表示され、そのままコピーされる。基準日は自動で付く。', why:'毎回おなじ前提をプロンプトに書き写す作業が、AI活用のなかで最も時間を食っていたため。入力欄は「繰り返し使う項目」だけに絞り、細かい指定はコピー後にAI側で埋める前提にした。' },
    { type:'new', t:'文字サイズ切替と印刷／PDF出力（v3.1）', d:'右上のAaで標準・大・特大の3段階。印刷時はチェックリストが全展開され、プロンプトを開いた状態で印刷すると、そのプロンプトだけが出力される。', why:'会議や現場で紙に出す場面と、画面を見る距離の違いに対応するため。' }
  ]}
],

<script>


var COMMON_FIELDS = [
  { k: 'purpose', label: '今回の目的・決めたいこと', ph: '例：この事業に90日で300万円を投じるかを決めたい', long: true, grp: 1 },
  { k: 'reader', label: '読み手・判断者', ph: '例：事業部長とCFO', long: false, grp: 1 },

 "顧客はその課題の解決に、すでに金や時間を使っているか": "2-4",
 "当初想定していなかった、より本質的な課題やインサイトを発見できたか": "2-4",
 "AIが生成した仮想ペルソナ・仮想インタビューを、実インタビューの代わりにしていないか": "2-3",

 "顧客は「欲しい」「使ってみたい」というポジティブな反応を示したか": "2-4",
 "「もしこの製品が〇〇円なら買いますか」で支払い意欲（WTP）を確認できたか": "2-4",
 "既存の代替手段（今のやり方・内製・他社サービス）と比較したうえでの相対的な価値を聞けているか": "2-4",
 "仮説のどの部分が正しく、どこが間違っていたかを明確に説明できるか": "2-4",
 "調査結果を踏まえ、事業仮説をより精度の高いものに修正できたか": "2-4",
 "顧客セグメントをさらに具体的に定義できているか（デモグラ・サイコグラフィック・行動変数）": "2-3",
 "提供価値を、競合にはない独自の価値として簡潔に表現できているか": "3-1",
 "「それ、今のやり方や既存ツールでできますよね」への回答を1文で言えるか": "3-1",
 "チャネル（販売網・広告・Web）は具体的に設計されているか": "3-2",
 "顧客との関係をどう築き、維持・発展させるか": "3-2",
 "AIや検索を経由した発見経路を織り込んだか（一次情報の公開、比較サイト掲載、FAQ、構造化データ）": "2-5",
 "課金の単位（何を数えて課金するか）は、数量／期間／成果のどれか。顧客の価値実感と連動しているか": "3-2",
 "完全な成果報酬にする場合、「成果」の定義と計測方法を第三者が検証できるか": "3-5",
 "主要な仕入先・外部サービスの値上げや提供終了が起きたとき、価格と原価を差し替えられる契約設計か": "3-5",
 "コスト構造：最も大きなコストは何か。固定費と変動費の内訳はどうか。使われるほど粗利が悪化する構造になっていないか": "3-5",
 "価値提供に不可欠な主要活動（開発・製造・マーケ・営業）は何か": "3-2",
 "必要な経営資源（ヒト・モノ・カネ・知的財産）は自社保有か、外部調達か": "3-2",
 "協業すべきパートナーは誰か": "3-2",
 "外部に依存する工程（委託先・仕入先・プラットフォーム）が止まったときの代替手段があるか": "3-2",
 "ビジネスモデルキャンバス等に落とし込み、矛盾や抜け漏れがないか確認できているか": "3-2",
 "「作らないもの・やらないこと」を明記したか": "3-3",
 "エグゼクティブサマリー：全体像・魅力・必要投資額・期待リターンが数ページで理解できるか": "4-1",
 "市場機会と戦略：市場分析・顧客課題・競合優位性・事業戦略が第三者にも分かりやすいか": "4-1",
 "実行計画：アクションプランがマイルストーンと担当者付きで示されているか。主要KPIは設定されているか": "4-1",
 "財務計画：売上・費用・利益の予測が3〜5年分あり、算出根拠が明確か（PL、CF計算書は必須）": "4-1",
 "体制：コアメンバーと役割、必要なスキルセットが明記されているか": "4-1",
 "リスク分析：想定リスクと具体的な対応策が検討されているか": "4-1",
 "数字に根拠レベル（実測／一次情報／推計／仮説）のラベルを付けたか": "4-1",
 "主要な変動費と、その値上がりリスクを財務計画に織り込んだか": "3-5",
 "撤退基準（Kill criteria）と判断時期を先に決めているか": "4-1",
 "引用した数字と出典が、原典まで辿れる状態で資料に残っているか": "4-1",
 "ストーリー：なぜ今、この事業を我々がやるべきかという「Why」から始まっているか": "4-2",
 "明快さ：図やグラフを効果的に使い、キーメッセージが明確に伝わるか": "4-2",
 "要求の明確化：何を判断し、承認してほしいのか（ヒト・モノ・カネ）が具体的に示されているか": "4-2",
 "質疑応答対策：想定質問と回答を準備できているか。とくに弱みやリスクに誠実に答えられるか": "4-3"
};

</script>
<script>
(function () {
  'use strict';

  var VIEWS = [DATA.common].concat(DATA.steps);
  var state = { view: DATA.common.id, checked: {}, open: {}, diff: false, q: '', vals: {}, task: null, route: true, mobileTab: 'tasks' };
  (function markCore() {
    var setC = {};
    CORE_CHECKS.forEach(function (t) { setC[t] = 1; });
    DATA.steps.forEach(function (st) {
      st.checks.forEach(function (g) { g.items.forEach(function (it) { it.core = !!setC[it.t]; }); });
      st.tasks.forEach(function (tk) { tk.core = CORE_TASKS.indexOf(tk.id) >= 0; });
    });
  })();
  function visItems(g) {
    var out = [];
    g.items.forEach(function (it, ii) { if (!state.route || it.core) out.push({ it: it, ii: ii }); });
    return out;
  }
  function taskLink(text) {
    var id = CHECK_LINKS[text];
    if (!id) return '';
    var sid = 's' + id.charAt(0);
    var st = VIEWS.filter(function (v) { return v.id === sid; })[0];
    if (!st || !st.tasks) return '';
    var tk = st.tasks.filter(function (x) { return x.id === id; })[0];
    if (!tk) return '';
    return '<button class="tasklink" data-task="' + sid + '|' + id + '" style="--c:' + st.color + '" ' +
      'title="' + esc(tk.title) + ' を開く">' + esc(id) + '</button>';
  }
  function lv(pk) { return PROMPT_LV[pk] || 'must'; }
  function lvChips(stId, tk) {
    var c = { must: 0, opt: 0, ext: 0 };
    tk.prompts.forEach(function (p, pi) { c[lv(stId + '|' + tk.id + '|' + pi)]++; });
    var out = '';
    if (c.must) out += '<span class="lv lv-must">必須 ' + c.must + '本</span>';
    if (c.opt) out += '<span class="lv lv-opt">選択 ' + c.opt + '本から1本</span>';
    if (c.ext && !state.route) out += '<span class="lv lv-ext">発展 ' + c.ext + '本</span>';
    if (c.ext && state.route) out += '<span class="lv lv-ext dim">発展 ' + c.ext + '本（非表示）</span>';
    return out;
  }
  function visPrompts(stId, tk) {
    var out = [];
    tk.prompts.forEach(function (p, pi) {
      var L = lv(stId + '|' + tk.id + '|' + pi);
      if (state.route && L === 'ext') return;
      out.push({ p: p, pi: pi, lv: L });
    });
    return out;
  }
  function visTasks(st) {
    return st.tasks.filter(function (t) { return visPrompts(st.id, t).length > 0; });
  }
  function extCount(st) {
    var n = 0;
    st.tasks.forEach(function (t) {
      t.prompts.forEach(function (p, pi) { if (lv(st.id + '|' + t.id + '|' + pi) === 'ext') n++; });
    });
    return n;
  }
  function mustCount(st) {
    var n = 0;
    st.tasks.forEach(function (t) {
      t.prompts.forEach(function (p, pi) { if (lv(st.id + '|' + t.id + '|' + pi) === 'must') n++; });
    });
    return n;
  }
  function optGroups(st) {
    var n = 0;
    st.tasks.forEach(function (t) {
      var has = false;
      t.prompts.forEach(function (p, pi) { if (lv(st.id + '|' + t.id + '|' + pi) === 'opt') has = true; });
      if (has) n++;
    });
    return n;
  }
  var COMMON_KEYS = COMMON_FIELDS.map(function (f) { return f.k; });
  function fieldDef(k) {
    var c = COMMON_FIELDS.filter(function (f) { return f.k === k; })[0];
    return c || null;
  }
  var PROMPTS = {};
  var INDEX = [];

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function vars(x) { return x.replace(/\[([^\[\]\n]{1,140})\]/g, '<span class="var">[$1]</span>'); }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }


  var STORAGE_KEY = 'bd-playbook-2026-state-v1';
  var VALID_CHECKS = {};
  DATA.steps.forEach(function (st) {
    st.checks.forEach(function (g, gi) {
      g.items.forEach(function (it, ii) { VALID_CHECKS[st.id + ':' + gi + ':' + ii] = true; });
    });
  });
  var saveTimer;
  function restoreSavedState() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (!saved || typeof saved !== 'object') return;
      if (saved.checked && typeof saved.checked === 'object') {
        Object.keys(saved.checked).forEach(function (k) {
          if (VALID_CHECKS[k] && saved.checked[k]) state.checked[k] = true;
        });
      }
      if (saved.vals && typeof saved.vals === 'object') {
        COMMON_KEYS.forEach(function (k) {
          if (typeof saved.vals[k] === 'string') state.vals[k] = saved.vals[k];
        });
      }
    } catch (err) {

    }
  }
  function saveState() {
    clearTimeout(saveTimer);
    var checked = {}, vals = {};
    Object.keys(state.checked).forEach(function (k) {
      if (VALID_CHECKS[k] && state.checked[k]) checked[k] = true;
    });
    COMMON_KEYS.forEach(function (k) {
      if (typeof state.vals[k] === 'string' && state.vals[k]) vals[k] = state.vals[k];
    });
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, checked: checked, vals: vals }));
    } catch (err) {

    }
  }
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveState, 180);
  }

  var DIFF_LABEL = { 'new': '新規追加', 'upd': '変更', 'fix': '不具合修正' };
  var DIFF_TEXT = { 'new': 'NEW', 'upd': '更新', 'fix': '修正' };
  var DIFF_CLS = { 'new': 'b-new', 'upd': 'b-upd', 'fix': 'b-fix' };

  function badge(d, always) {
    if (!d) return '';
    return '<span class="badge ' + (always ? '' : 'dfb ') + DIFF_CLS[d] + '">' + DIFF_TEXT[d] + '</span>';
  }
  function note(d, was, n) {
    if (!d || (!was && !n)) return '';
    var h = '<div class="diff-note"><b>' + DIFF_LABEL[d] + '</b>';
    if (was) h += '<s>' + esc(was) + '</s><br>';
    if (n) h += esc(n);
    return h + '</div>';
  }


  function buildIndex() {
    var n = 0;
    DATA.common.blocks.forEach(function (b, i) {
      if (b.diff) n++;
      INDEX.push({ kind: 'common', viewId: 'common', viewName: '共通ルール', no: 'BASE',
        color: 'var(--common)', title: b.h, body: b.items.join(' ') + ' ' + (b.note || '') });
    });
    DATA.steps.forEach(function (st) {
      st.checks.forEach(function (g) {
        if (g.diff) n++;
        g.items.forEach(function (it) {
          if (it.diff) n++;
          INDEX.push({ kind: 'check', viewId: st.id, viewName: st.name, no: st.no, color: st.color,
            title: it.t, body: g.g + ' ' + (it.note || '') + ' ' + (it.was || '') });
        });
      });
      st.tasks.forEach(function (tk) {
        if (tk.diff) n++;
        var body = tk.desc + ' ';
        tk.prompts.forEach(function (p, pi) {
          if (p.diff) n++;
          PROMPTS[st.id + '|' + tk.id + '|' + pi] = p.text;
          body += p.sub + ' ' + p.text + ' ' + (p.note || '') + ' ';
        });
        INDEX.push({ kind: 'task', viewId: st.id, viewName: st.name, no: st.no, color: st.color,
          title: tk.id + ' ' + tk.title, body: body, taskId: tk.id });
      });
    });
    $('#diffCount').textContent = n;
  }

  function totals(st) {
    if (st.kind !== 'step') return null;
    var total = 0, done = 0;
    st.checks.forEach(function (g, gi) {
      visItems(g).forEach(function (x) {
        total++;
        if (state.checked[st.id + ':' + gi + ':' + x.ii]) done++;
      });
    });
    return { total: total, done: done };
  }


  function ring(pct, color, label) {
    var r = 14, c = 2 * Math.PI * r;
    return '<span class="ring" style="--c:' + color + '">' +
      '<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">' +
      '<circle class="bgc" cx="17" cy="17" r="' + r + '" fill="none" stroke-width="3"/>' +
      '<circle class="fgc" cx="17" cy="17" r="' + r + '" fill="none" stroke-width="3" stroke-linecap="round" ' +
      'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - pct / 100)).toFixed(1) + '"/></svg>' +
      '<b>' + label + '</b></span>';
  }
  function renderRail() {
    $('#rail').innerHTML = VIEWS.map(function (v, i) {
      var t = totals(v);
      var pct = t && t.total ? Math.round(t.done / t.total * 100) : (v.kind === 'common' ? 100 : 0);
      var label = t ? (t.done + '/' + t.total) : '◆';
      var meta = t ? (pct + '% 確認済み') : '全工程の前提';
      return '<button class="stage" data-view="' + v.id + '" style="--c:' + v.color + '"' +
        ' aria-current="' + (state.view === v.id && !state.q ? 'true' : 'false') + '">' +
        ring(pct, v.color, label) +
        '<span class="stage-txt"><span class="stage-no">' + esc(v.no) + '</span>' +
        '<span class="stage-nm">' + esc(v.short || v.name) + '</span>' +
        '<span class="stage-mt">' + esc(meta) + '</span></span></button>';
    }).join('');
  }

  function currentViewIndex() {
    var idx = 0;
    VIEWS.forEach(function (v, i) { if (v.id === state.view) idx = i; });
    return idx;
  }
  function mobilePromptTarget(view) {
    var st = view && view.kind === 'step' ? view : VIEWS.filter(function (v) { return v.kind === 'step'; })[0];
    if (!st) return null;
    var tasks = visTasks(st);
    if (!tasks.length) return null;
    if (state.task && state.task.st.id === st.id) {
      var last = tasks.filter(function (tk) { return tk.id === state.task.tk.id; })[0];
      if (last) return { st: st, tk: last };
    }
    return { st: st, tk: tasks[0] };
  }
  function renderMobileDock() {
    var dock = $('#mobileDock');
    if (!dock) return;
    var idx = currentViewIndex();
    var view = VIEWS[idx], prev = VIEWS[idx - 1], next = VIEWS[idx + 1];
    var target = mobilePromptTarget(view);
    dock.innerHTML =
      '<button' + (prev ? ' data-view="' + prev.id + '" aria-label="前の工程：' + esc(prev.short || prev.name) + '"' : ' disabled') + '>' +
        '<span aria-hidden="true">←</span><span>前へ</span></button>' +
      '<button class="mobile-prompt"' + (target
        ? ' data-task="' + target.st.id + '|' + target.tk.id + '" aria-label="プロンプトを開く：' + esc(target.tk.title) + '"'
        : ' disabled') + '><span>プロンプトを開く</span></button>' +
      '<button' + (next ? ' data-view="' + next.id + '" aria-label="次の工程：' + esc(next.short || next.name) + '"' : ' disabled') + '>' +
        '<span>次へ</span><span aria-hidden="true">→</span></button>';
  }

  function mobileViewTabs(st) {
    var t = totals(st);
    var active = /^(overview|tasks|checks)$/.test(state.mobileTab) ? state.mobileTab : 'tasks';
    var tabs = [
      { id: 'overview', label: '概要', meta: '' },
      { id: 'tasks', label: 'タスク', meta: String(visTasks(st).length) },
      { id: 'checks', label: 'チェック', meta: t.done + '/' + t.total }
    ];
    return '<div class="mobile-view-tabs" role="tablist" aria-label="表示内容">' +
      tabs.map(function (tab) {
        var selected = tab.id === active;
        return '<button role="tab" data-mobile-tab="' + tab.id + '" aria-selected="' + selected + '"' +
          ' tabindex="' + (selected ? '0' : '-1') + '"><span>' + tab.label + '</span>' +
          (tab.meta ? '<span class="tab-count">' + tab.meta + '</span>' : '') + '</button>';
      }).join('') + '</div>';
  }


  function renderCommon() {
    var c = DATA.common;
    var h = '<div class="hero" style="--c:' + c.color + '">' +
      '<span class="crumb">' + esc(c.no) + ' ／ 全工程の前提</span>' +
      '<h2>' + esc(c.name) + '</h2>' +
      '<p class="lead">' + esc(c.lead) + '</p>' +
      '<section class="quickstart" aria-labelledby="quickstart-title"><div class="quickstart-h">' +
      '<span>QUICK START</span><b id="quickstart-title">プレイブックの使い方</b></div>' +
      '<ol class="quickstart-steps">' + c.usage.map(function (item, i) {
        return '<li class="quickstart-step"><span class="num">0' + (i + 1) + '</span>' +
          '<strong>' + esc(item.t) + '</strong><p>' + esc(item.d) + '</p></li>';
      }).join('') + '</ol><p class="quickstart-note"><strong>使い方のポイント：</strong>' +
      esc(c.usageNote) + '</p></section></div>';

    h += '<div class="cols" style="--c:' + c.color + '"><div class="stack">';
    var half = Math.ceil(c.blocks.length / 2);
    c.blocks.forEach(function (b, i) {
      if (i === half) h += '</div><div class="stack">';
      var key = 'common:' + i;
      var opened = state.open[key] === true;
      var summary = b.items.length ? b.items[0] : (b.note || '');
      var details = b.items.slice(1);
      h += '<section class="card common-rule"' + (b.diff ? ' data-diff="' + b.diff + '"' : '') + '>' +
        '<button class="card-h common-rule-h" data-common-rule="' + key + '" aria-expanded="' + opened + '">' +
        '<h3>' + esc(b.h) + '</h3><span class="right">' + badge(b.diff) +
        '<span class="common-chev" aria-hidden="true"></span></span></button>' +
        '<div class="common-key"><span class="common-key-label">要点</span><p>' + vars(esc(summary)) + '</p></div>' +
        '<div class="card-b common-detail">' + note(b.diff, b.was, b.note) +
        (details.length ? '<ul class="plain">' + details.map(function (x) { return '<li><span>' + vars(esc(x)) + '</span></li>'; }).join('') + '</ul>' : '') +
        '</div></section>';
    });
    h += '</div></div>';
    h += stepnav(0);
    return h;
  }


  function renderStep(st, idx) {
    var t = totals(st);
    var h = '<div class="hero" style="--c:' + st.color + '">' +
      '<span class="crumb">' + esc(st.no) + '</span>' +
      '<h2>' + esc(st.name) + '</h2>' +
      '<p class="lead">' + esc(st.purpose) + '</p>' +
      '<div class="gate"><span class="lbl">判断ゲート</span><p>' + esc(st.gate) + '</p></div>' +
      (state.route
        ? '<p class="routeline"><b>基本ルート</b>：必須プロンプト ' + mustCount(st) + ' 本' +
          (optGroups(st) ? '＋選択 ' + optGroups(st) + ' 箇所（各1本）' : '') +
          '／確認は ' + t.total + ' 項目。<button class="linkbtn" data-route="off">発展まで表示</button></p>'
        : '') + '</div>';

    h += mobileViewTabs(st);
    h += '<div class="cols step-cols" data-mobile-active="' + state.mobileTab + '">';


    h += '<div class="stack step-left" style="--c:' + st.color + '">';
    h += '<section class="card mobile-pane pane-overview"><div class="card-h"><h3>このステップのゴール</h3></div><div class="card-b">' +
      '<dl class="kv"><dt>GOAL</dt><dd>' + esc(st.goal) + '</dd></dl>' +
      (st.goalAdd ? '<dl class="kv"' + ' data-diff="new"><dt>2026年版で追加</dt><dd>' + badge('new') + ' ' + esc(st.goalAdd) + '</dd></dl>' : '') +
      '<dl class="kv"><dt>OUTPUT</dt><dd>' +
      st.outputs.filter(function (o) { return !state.route || EXT_OUTPUTS.indexOf(o) < 0; })
        .map(function (o) {
          var isExt = EXT_OUTPUTS.indexOf(o) >= 0;
          return '<span class="chip-out' + (isExt ? ' ext' : '') + '">' + esc(o) + (isExt ? '（発展）' : '') + '</span>';
        }).join(' ') +
      '</dd></dl></div></section>';

    h += '<section class="card mobile-pane pane-checks"><div class="card-h"><h3>チェックリスト</h3>' +
      '<span class="right"><span class="count-badge">' + t.done + ' / ' + t.total + '</span></span></div>' +
      '<p class="chk-hint">項目の横の番号は、そこを埋めるためのプロンプトです。クリックすると開きます。</p>';
    st.checks.forEach(function (g, gi) {
      var key = st.id + ':' + gi;
      var opened = state.open[key] !== false;
      var vis = visItems(g);
      if (!vis.length) return;
      var d = 0;
      vis.forEach(function (x) { if (state.checked[st.id + ':' + gi + ':' + x.ii]) d++; });

        saveState();
        refreshPreviews();
        toast('プロジェクト情報を消去しました');
      }
      return;
    }
    if ((el = e.target.closest('[data-route]'))) { setRoute(false); toast('すべての項目を表示しています'); return; }
    if (e.target.closest('#fontBtn')) { setFont(fontIdx + 1); toast('文字サイズ：' + FONT_STEPS[fontIdx].name); return; }
    if (e.target.closest('#openLog')) { openLog(); return; }
    if (e.target.closest('#logClose')) { closeLog(); return; }
    if (e.target === $('#logModal')) { closeLog(); return; }
    if (e.target.closest('#reset')) {
      state.checked = {}; saveState(); render(); toast('チェックをリセットしました'); return;
    }
    if (e.target.closest('#theme')) {
      var cur2 = document.documentElement.getAttribute('data-theme');
      setTheme(cur2 === 'dark' ? 'light' : 'dark'); return;
    }
  });

  document.addEventListener('change', function (e) {
    var c = e.target.closest('[data-chk]');
    if (!c) return;
    var id = c.getAttribute('data-chk');
    if (c.checked) state.checked[id] = true; else delete state.checked[id];
    saveState();
    var st = VIEWS.filter(function (x) { return x.id === state.view; })[0];
    if (st && st.kind === 'step') {
      st.checks.forEach(function (g, gi) {
        var d = 0;
        g.items.forEach(function (it, ii) { if (state.checked[st.id + ':' + gi + ':' + ii]) d++; });
        var head = $('[data-group="' + st.id + ':' + gi + '"]');
        if (head) head.querySelector('.cnt').textContent = d + '/' + g.items.length;
      });
      var t = totals(st);
      var top = $('.card-h .right .count-badge');
      if (top) top.textContent = t.done + ' / ' + t.total;
      renderRail();
    }
  });

  function setTheme(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    $('#themeIcon').innerHTML = mode === 'dark'
      ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
      : '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>';
  }

  function setRoute(on) {
    state.route = on;
    var b = $('#routeToggle');
    b.setAttribute('aria-pressed', String(on));
    render();
  }
  $('#routeToggle').addEventListener('click', function () { setRoute(!state.route); });

  $('#diffToggle').addEventListener('click', function () {
    state.diff = !state.diff;
    document.body.classList.toggle('diff-on', state.diff);
    this.setAttribute('aria-pressed', String(state.diff));
  });

  var qT;
  $('#q').addEventListener('input', function () {
    var v = this.value.trim();
    $('#qclear').hidden = !v;
    clearTimeout(qT);
    qT = setTimeout(function () { state.q = v; render(); }, 130);
  });
  $('#qclear').addEventListener('click', function () {
    $('#q').value = ''; state.q = ''; this.hidden = true; render(); $('#q').focus();
  });

  document.addEventListener('click', function (e) {
    if (e.target.closest('#mobileMore')) return;
    if (!e.target.closest('#topActions') || e.target.closest('#topActions button')) closeMobileMenu();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if ($('#topActions').classList.contains('on')) { closeMobileMenu(); return; }
      if ($('#pjModal').classList.contains('on')) { closePj(); return; }
      if ($('#logModal').classList.contains('on')) { closeLog(); return; }
      if ($('#drawer').classList.contains('on')) { closeDrawer(); return; }
      if (state.q) { $('#q').value = ''; state.q = ''; $('#qclear').hidden = true; render(); }
      return;
    }
    if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  });


  restoreSavedState();
  try {
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme('dark');
    else setTheme('light');
  } catch (err) { setTheme('light'); }
  buildIndex();
  renderLog();
  setFont(0);
  updatePjBtn();
  render();
  window.addEventListener('pagehide', saveState);
})();

</script>
</body>
</html>
